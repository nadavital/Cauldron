version: 2
updates:
  - package-ecosystem: npm
    directory: /firebase/functions
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
