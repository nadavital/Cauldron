name: Repository Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "43 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          mkdir -p gitleaks-bin
          tar -xzf gitleaks.tar.gz -C gitleaks-bin gitleaks
      - name: Scan history with redacted output
        shell: bash
        run: >-
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git .
          --log-opts='--all --full-history'
          --ignore-gitleaks-allow
          --redact=100
          --no-banner

  codeql:
    name: CodeQL web security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
