name: Hosted Sharing Monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: hosted-sharing-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production:
    name: Production routes and Universal Links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: firebase/functions
    env:
      CAULDRON_MONITOR_BASE_URL: https://cauldronrecipes.com
      CAULDRON_MONITOR_ALIAS_BASE_URL: https://cauldron-f900a.web.app
      CAULDRON_MONITOR_SECONDARY_ALIAS_BASE_URL: https://cauldron-f900a.firebaseapp.com
      CAULDRON_MONITOR_FUNCTION_BASE_URL: https://us-central1-cauldron-f900a.cloudfunctions.net
      CAULDRON_MONITOR_PROFILE_PATH: ${{ vars.CAULDRON_MONITOR_PROFILE_PATH || '/u/nadav' }}
      CAULDRON_MONITOR_LEGACY_PROFILE_PATH: ${{ vars.CAULDRON_MONITOR_LEGACY_PROFILE_PATH || '/profile/87BB336E-D474-4664-B06E-EC8E516B1748' }}
      CAULDRON_MONITOR_PROFILE_HANDLE: ${{ vars.CAULDRON_MONITOR_PROFILE_HANDLE || 'nadav' }}
      CAULDRON_MONITOR_PROFILE_NAME: ${{ vars.CAULDRON_MONITOR_PROFILE_NAME || 'Nadav' }}
      CAULDRON_MONITOR_RECIPE_PATH: ${{ vars.CAULDRON_MONITOR_RECIPE_PATH || '/recipe/7DBEAFFD-895F-43B1-9985-463F36EA5D8C' }}
      CAULDRON_MONITOR_CANONICAL_RECIPE_PATH: ${{ vars.CAULDRON_MONITOR_CANONICAL_RECIPE_PATH || '/u/nadav/7DBEAFFD-895F-43B1-9985-463F36EA5D8C' }}
      CAULDRON_MONITOR_COLLECTION_PATH: ${{ vars.CAULDRON_MONITOR_COLLECTION_PATH || '/collection/9B0D2D38-3B17-406A-83EC-3F35B21BDB42' }}
      CAULDRON_MONITOR_COLLECTION_TITLE: ${{ vars.CAULDRON_MONITOR_COLLECTION_TITLE || 'Bakery' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Probe hosted sharing contract
        run: npm run monitor:hosted
