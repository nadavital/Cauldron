name: Production Readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_xcode_build:
        description: Exact Xcode build required for this manual release verification
        required: true
        default: 27A5237l

concurrency:
  group: production-readiness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PR/push CI accepts any Xcode 27 image so preview rotation cannot strand the
  # repository. A manually dispatched release verification remains exact.
  EXPECTED_XCODE_BUILD: ${{ inputs.expected_xcode_build || '27A5237l' }}
  REQUIRE_EXACT_XCODE_BUILD: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

jobs:
  firebase:
    name: Firebase security and web tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version-file: .java-version
      - run: npm ci
      - run: npm test
      - run: npm run audit:production

  ios:
    name: iOS 27 build and tests
    # GitHub's dedicated Xcode 27 preview image exposes only its current Xcode
    # 27 beta. The verification step fails clearly if the label ever drifts to
    # another major SDK rather than silently compiling against the wrong one.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Xcode 27 toolchain
        run: tools/ci/verify_xcode_27.sh
      - name: Verify release configuration
        run: tools/ci/verify_release_configuration.sh
      - name: Run iOS tests
        run: >-
          xcodebuild test
          -scheme Cauldron
          -destination 'platform=iOS Simulator,name=iPhone 17'
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned iOS release
        run: >-
          xcodebuild build
          -scheme Cauldron
          -destination 'generic/platform=iOS'
          -configuration Release
          CODE_SIGNING_ALLOWED=NO

  catalyst:
    name: Mac Catalyst build and tests
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Xcode 27 toolchain
        run: tools/ci/verify_xcode_27.sh
      - name: Run Mac Catalyst tests
        run: >-
          xcodebuild test
          -scheme Cauldron
          -destination 'platform=macOS,variant=Mac Catalyst,name=My Mac'
          -configuration Debug
          MACOSX_DEPLOYMENT_TARGET=26.0
          CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned Mac Catalyst release
        run: >-
          xcodebuild build
          -scheme Cauldron
          -destination 'platform=macOS,variant=Mac Catalyst,name=My Mac'
          -configuration Release
          MACOSX_DEPLOYMENT_TARGET=26.0
          CODE_SIGNING_ALLOWED=NO
